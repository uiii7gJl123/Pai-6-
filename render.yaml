services:
  - type: web
    name: pai6-final
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install --no-audit --no-fund && npm run build
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: UPLOAD_DIR
        value: uploads
      - key: OPENAI_API_KEY   # أضف القيمة من لوحة Render
        sync: false